name: Sincronizar URLs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - name: Commit solo si cambió
        run: |
          if ! git diff --quiet dato.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dato.json
            git commit -m "Actualiza URLs desde la fuente"
            git push
          fi
